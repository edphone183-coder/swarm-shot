services:
  - type: web
    name: swarm-shot
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMINS          # creator panel allowlist, e.g. yourname:a-long-random-key. Set the value in the Render dashboard, never in git.
        sync: false
